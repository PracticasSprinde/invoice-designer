<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diseñador de facturas" />
    <meta name="keywords" content="invoice,designer" />
    <!-- Esta linea es un comentario -->
    <title>InvoiceDesigner</title>

    <!-- Rutas a los estilos -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/views/invoices.css">
    <link rel="stylesheet" href="css/views/clients.css">
    <link rel="stylesheet" href="css/views/products.css">
    <link rel="stylesheet" href="css/views/templates.css">
    <link rel="stylesheet" href="css/views/editor.css">
    <link rel="stylesheet" href="css/views/issuer.css">
    <link rel="stylesheet" href="css/views/settings.css">

    <!-- biblioteca para iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


</head>

<body>
    <!-- Div(contenedor principal) - app(identificacion para css .app) -->
    <div class="app">

        <!-- contenido secundario - sidebar(identificacion para css .sidebar) -->
        <aside class="sidebar">
 
            <!-- logo del sidebar -->
            <img src="assets/logo.png" class="logo-full" alt="Logo del sidebar">
            <img src="assets/logo_small.png" class="logo-small" alt="Logo pequeño">

            <!-- enlaces a distintas paginas -->
            <nav>
                <!-- enlaces superior del sidebar -->
                <div class="menu-top">
                    <!-- data-view(que vista mostrar) -->
                    <a href="#" data-view="invoices" title="Facturas">
                        <i class="bi bi-receipt"></i>
                        Facturas
                    </a>
                    <a href="#" data-view="clients" title="Clientes">
                        <i class="bi bi-people"></i>
                        Clientes
                    </a>
                    <a href="#" data-view="products" title="Productos">
                        <i class="bi bi-box-seam"></i>
                        Productos
                    </a>
                    <a href="#" data-view="templates" title="Plantillas">
                        <i class="bi bi-files"></i>
                        Plantillas
                    </a>
                    <a href="#" data-view="editor" title="Editor">
                        <i class="bi bi-pencil-square"></i>
                        Editor
                    </a>
                </div>

                <hr>
                <!-- enlaces inferior del sidebar -->
                <div class="menu-bottom">
                    <a href="#" data-view="issuer" title="Emisor">
                        <i class="bi bi-person-vcard"></i>
                        Mis datos fiscales
                    </a>
                    <a href="#" data-view="settings" title="Configuración">
                        <i class="bi bi-gear"></i>
                        Configuración
                    </a>
                </div>
            </nav>

        </aside>

        <!-- contenido principal - content(identificacion para css .content) -->
        <main class="content">

            <!-- seccion de contenido (tablas) - cargaran las paginas (identificacion css .section)-->
            <section id="view">
                <p>Aquí irá el contenido</p>
            </section>

        </main>
    </div>

    <!-- llamadas a API -->
    <script src="js/api.js"></script> 

    <!-- vistas de la app -->
    <script src="js/views/invoices.js"></script>
    <script src="js/views/templates.js"></script>
    <script src="js/views/editor.js"></script>
    <script src="js/views/clients.js"></script>
    <script src="js/views/products.js"></script>
    <script src="js/views/issuer.js"></script>

    <!-- menu de la app -->
    <script src="js/menu.js"></script> 
</body>

</html>
