<div class="view-issuer">

    <!-- cabecera -->
    <div class="issuer-header">
        <h1>Mis datos fiscales</h1>
    </div>

    <!-- formulario del emisor -->
    <div class="form-issuer">

        <!-- campos del formulario -->
        <div class="form-body">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name">
            </div>

            <div class="form-group">
                <label for="last-name">Apellidos</label>
                <input type="text" id="last-name">
            </div>

            <div class="form-group">
                <label for="enterprise">Empresa</label>
                <input type="text" id="enterprise">
            </div>

            <div class="form-group">
                <label for="cif-nif">NIF/CIF</label>
                <input type="text" id="cif-nif">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono</label>
                <input type="tel" id="phone">
            </div>

            <div class="form-group">
                <label for="address">Dirección</label>
                <input type="text" id="address">
            </div>

            <div class="form-group">
                <label for="city">Ciudad</label>
                <input type="text" id="city">
            </div>

            <div class="form-group">
                <label for="postal-code">Código Postal</label>
                <input type="text" id="posta-code">
            </div>

            <div class="form-group">
                <label for="country">País</label>
                <input type="text" id="country">
            </div>

            

        </div>

        <!-- botones del formulario -->
            <div class="form-footer">
                <button type="button" class="btn-save">
                    <i class="bi bi-save"></i>
                    <span>Guardar</span>
                </button>
            </div>

    </div>



</div>
