<div class="view-clients">

    <!-- titulo y botón -->
    <div class="clients-header">
        <h1>Clientes</h1>

        <!-- boton para añadir clientes -->
        <button type="button" class="new-client" title="Añadir un cliente">
            <i class="bi bi-plus"></i>
            Añadir cliente
        </button>
    </div>


    <!-- modal de clientes -->
    <div class="modal-clients">
        <!-- formulario clientes -->
        <div class="form-clients">
            <div class="form-header">
                <h2>Nuevo cliente</h2>
                <button type="button" class="btn-close-modal">
                    <i class="bi bi-x-lg"></i>
                </button>

            </div>

            <!-- campos del formulario -->
            <div class="form-body">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name">
                </div>
                <div class="form-group">
                    <label for="last-name">Apellido</label>
                    <input type="text" id="last-name">
                </div>
                <div class="form-group">
                    <label for="enterprise">Empresa</label>
                    <input type="text" id="enterprise">
                </div>
                <div class="form-group">
                    <label for="cif-nif">CIF/NIF</label>
                    <input type="text" id="cif-nif">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label for="phone">Telefono</label>
                    <input type="tel" id="phone">
                </div>
                <div class="form-group">
                    <label for="address">Direccion</label>
                    <input type="text" id="address">
                </div>
                <div class="form-group">
                    <label for="city">Ciudad</label>
                    <input type="text" id="city">
                </div>
                <div class="form-group">
                    <label for="postal-code">Cod. Postal</label>
                    <input type="text" id="postal-code">
                </div>
                <div class="form-group">
                    <label for="country">Pais</label>
                    <select id="country">
                        <option value="ES">España</option>
                        <option value="FR">Francia</option>
                        <option value="PT">Portugal</option>
                    </select>
                </div>
            </div>

            <!-- botones del formulario -->
            <div class="form-footer">
                <button type="button" class="btn-cancel">
                    <i class="bi bi-x-lg"></i>
                    Cancelar
                </button>
                <button type="button" class="btn-save">
                    <i class="bi bi-save"></i>
                    Guardar
                </button>
            </div>


        </div>


    </div>



    <!-- tabla de clientes -->
    <section>
        <div class="table-clients">
            <table>

                <thead>
                    <tr>
                        <th>Nombre<br>Empresa</th>
                        <th>CIF/NIF</th>
                        <th>Email</th>
                        <th>Telefono</th>
                        <th>Localidad</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Ana</td>
                        <td>11111111T</td>
                        <td>ana@gmail.com</td>
                        <td>333444555</td>
                        <td>España</td>
                        <td>
                            <button type="button" class="btn-edit" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn-delete" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr>
                        <td>Carlos</td>
                        <td>22222222T</td>
                        <td>calros@gmail.com</td>
                        <td>222333444</td>
                        <td>España</td>
                        <td>
                            <button type="button" class="btn-edit" title="Editar">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button type="button" class="btn-delete" title="Eliminar">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </section>

</div>
