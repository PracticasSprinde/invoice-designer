<div class="view-templates">

    <!-- titulo y botón -->
    <div class="templates-header">
        <h1>Plantillas</h1>

        <!-- boton para crear factura -->
        <button type="button" class="new-template" title="Crear plantilla">
            <i class="bi bi-plus"></i>
            Crear plantilla
        </button>
    </div>

    <section class="templates-section">

        <!-- vista del contenedor de la plantilla -->
        <div class="templates-grid">

            <div class="template-card">

                <!-- hoja de la miniatura -->
                <div class="template-sheet">

                    <h5>FACTURA</h5>
                    <div class="template-sheet-line"></div>
                    <div class="template-sheet-line"></div>
                    <div class="template-sheet-line"></div>

                </div>


                <div class="template-info">

                    <h4>Plantilla básica</h4>
                    <span>Predeterminada</span>

                </div>

                <!-- botones de accion de la plantilla -->
                <div class="template-actions">

                    <button type="button" class="btn-edit-template" title="Editar">
                        <i class="bi bi-pencil"></i>
                    </button>

                    <button type="button" class="btn-delete-template" title="Eliminar">
                        <i class="bi bi-trash"></i>
                    </button>

                </div>

            </div>

        </div>

    </section>

</div>
