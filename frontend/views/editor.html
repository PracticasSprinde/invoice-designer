<div class="view-editor">
    <!-- cabecera editor -->
    <header class="editor-header">

        <!-- botones -->
        <div class="editor-actions">

            <!-- botones de historial -->
            <div class="editor-history">

                <!-- boton deshacer -->
                <button type="button" class="btn-undo" title="Deshacer">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>

                <!-- boton rehacer -->
                <button type="button" class="btn-redo" title="Rehacer">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>

                <!-- boton eliminar -->
                <button type="button" class="btn-delete" title="Eliminar">
                    <i class="bi bi-trash"></i>
                </button>

            </div>

            <!-- botones de acciones -->
            <div class="editor-controls">

                <!-- boton volver -->
                <button type="button" class="btn-back-editor" title="Volver">
                    <i class="bi bi-arrow-bar-left"></i>
                    <span>Volver</span>
                </button>

                <!-- nombre plantilla -->
                <input type="text" class="form-control" value="Plantilla básica">

                <!-- boton guardar -->
                <button type="button" class="btn-save-template" title="Guardar">
                    <i class="bi bi-save"></i>
                    <span>Guardar</span>
                </button>
            </div>

        </div>

    </header>

    <!-- panel editor -->
    <div class="editor-content">

        <!-- barra propiedades -->
        <div class="editor-properties" id="editor-bar">
            <span class="properties-empty">
                Selecciona un elemento de la hoja para editar sus propiedades
            </span>
        </div>

        <div class="editor-main">

            <!-- panel herramientas -->
            <aside class="editor-tools">
                <h3>Elementos</h3>

                <!-- lista herramientas -->
                <div class="tools-list">

                    <!-- texto -->
                    <button type="button" class="tool-button" title="Texto">
                        <i class="bi bi-type"></i>
                        <span>Texto</span>
                    </button>

                    <!-- logo -->
                    <button type="button" class="tool-button" title="Logo">
                        <i class="bi bi-image"></i>
                        <span>Logo</span>
                    </button>

                    <!-- emisor -->
                    <button type="button" class="tool-button" title="Emisor">
                        <i class="bi bi-person"></i>
                        <span>Emisor</span>
                    </button>

                    <!-- cliente -->
                    <button type="button" class="tool-button" title="Cliente">
                        <i class="bi bi-person-vcard"></i>
                        <span>Cliente</span>
                    </button>

                    <!-- fecha -->
                    <button type="button" class="tool-button" title="Fecha">
                        <i class="bi bi-calendar"></i>
                        <span>Fecha</span>
                    </button>

                    <!-- numero factura -->
                    <button type="button" class="tool-button" title="Número">
                        <i class="bi bi-hash"></i>
                        <span>Número</span>
                    </button>

                    <!-- separador -->
                    <button type="button" class="tool-button" title="Separador">
                        <i class="bi bi-hr"></i>
                        <span>Separador</span>
                    </button>

                    <!-- conceptos -->
                    <button type="button" class="tool-button" title="Conceptos">
                        <i class="bi bi-table"></i>
                        <span>Conceptos</span>
                    </button>

                    <!-- iva -->
                    <button type="button" class="tool-button" title="Desglose IVA">
                        <i class="bi bi-percent"></i>
                        <span>Desglose IVA</span>
                    </button>

                    <!-- resumen -->
                    <button type="button" class="tool-button" title="Resumen">
                        <i class="bi bi-calculator"></i>
                        <span>Resumen</span>
                    </button>

                    <!-- notas -->
                    <button type="button" class="tool-button" title="Notas">
                        <i class="bi bi-sticky"></i>
                        <span>Notas</span>
                    </button>
                </div>

            </aside>

            <!-- zona de trabajo -->
            <main class="editor-workspace">

                <!-- hoja factura -->
                <div class="invoice-sheet">

                </div>

            </main>

        </div>

    </div>

</div>
