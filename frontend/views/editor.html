<div class="view-editor">
    <!-- cabecera editor -->
    <header class="editor-header">

        <h2>Editor</h2>

        <div class="editor-actions">

            <!-- boton volver -->
        <button type="button" class="btn-back-editor" title="Volver">
            <i class="bi bi-arrow-bar-left"></i>
            Volver
        </button>

        <!-- nombre plantilla -->
        <div class="editor-name">
            <input type="text" class="form-control" value="Plantilla básica">
        </div>

        <!-- boton guardar -->
        <button type="button" class="btn-save-template" title="Guardar">
            <i class="bi bi-save"></i>
            Guardar
        </button>


        </div>

        

    </header>

    <!-- panel editor -->
    <div class="editor-content">

        <!-- panel herramientas -->
        <aside class="editor-tools">
            <h3>Elementos</h3>

            <!-- lista herramientas -->
            <div class="tools-list">

                <!-- texto -->
                <button type="button" class="tool-button">
                    <i class="bi bi-type"></i>
                    <span>Texto</span>
                </button>

                <!-- logo -->
                <button type="button" class="tool-button">
                    <i class="bi bi-image"></i>
                    <span>Logo</span>
                </button>

                <!-- emisor -->
                <button type="button" class="tool-button">
                    <i class="bi bi-person"></i>
                    <span>Emisor</span>
                </button>

                <!-- cliente -->
                <button type="button" class="tool-button">
                    <i class="bi bi-person-vcard"></i>
                    <span>Cliente</span>
                </button>

                <!-- fecha -->
                <button type="button" class="tool-button">
                    <i class="bi bi-calendar"></i>
                    <span>Fecha</span>
                </button>

                <!-- numero factura -->
                <button type="button" class="tool-button">
                    <i class="bi bi-hash"></i>
                    <span>Número</span>
                </button>

                <!-- separador -->
                <button type="button" class="tool-button">
                    <i class="bi bi-hr"></i>
                    <span>Separador</span>
                </button>

                <!-- conceptos -->
                <button type="button" class="tool-button">
                    <i class="bi bi-table"></i>
                    <span>Conceptos</span>
                </button>

                <!-- iva -->
                <button type="button" class="tool-button">
                    <i class="bi bi-percent"></i>
                    <span>Desglose IVA</span>
                </button>

                <!-- resumen -->
                <button type="button" class="tool-button">
                    <i class="bi bi-calculator"></i>
                    <span>Resumen</span>
                </button>

                <!-- notas -->
                <button type="button" class="tool-button">
                    <i class="bi bi-sticky"></i>
                    <span>Notas</span>
                </button>

                <!-- numero de pagina -->
                <button type="button" class="tool-button">
                    <i class="bi bi-file-earmark"></i>
                    <span>Página</span>
                </button>

            </div>

        </aside>

        <!-- zona de trabajo -->
        <main class="editor-workspace">

            <!-- hoja factura -->
            <div class="invoice-sheet">

                <h2 class="invoice-title">FACTURA</h2>

            </div>

        </main>

        <!-- panel propiedades -->
        <aside class="editor-properties">
            <h3>Propiedades</h3>
            <p class="properties-empty">Selecciona un elemento de la hoja para editar sus propiedades</p>
        </aside>

    </div>

</div>
